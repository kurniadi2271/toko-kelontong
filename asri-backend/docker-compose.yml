# Untuk development LOKAL saja (menjalankan Postgres di komputer sendiri).
# Untuk PRODUKSI, gunakan Supabase (lihat README.md) dan cukup deploy
# image backend ini (docker build -t asri-backend .) ke platform pilihan Anda.
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asri_pos
    ports:
      - '5432:5432'
    volumes:
      - asri_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/asri_pos
      DATABASE_SSL: 'false'
      JWT_SECRET: local_dev_secret_change_me
      JWT_EXPIRES_IN: 8h
      FRONTEND_ORIGIN: http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  asri_pgdata:
