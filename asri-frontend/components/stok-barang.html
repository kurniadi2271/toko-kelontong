<div class="space-y-4">
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-3">
        <div class="flex gap-2">
            <button onclick="StokBarangPage.filterStatus('all')" id="stock-filter-all" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-sage-600 text-white">Semua Stok</button>
            <button onclick="StokBarangPage.filterStatus('low')" id="stock-filter-low" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200">Stok Menipis</button>
        </div>
        <p class="text-xs text-gray-500" id="stock-summary-text">Menampilkan semua barang</p>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-x-auto">
        <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 border-b border-gray-100 text-gray-600 font-semibold uppercase">
                <tr>
                    <th class="p-3">Nama Barang</th>
                    <th class="p-3">Kategori</th>
                    <th class="p-3 text-center">Stok Saat Ini</th>
                    <th class="p-3 text-center">Status</th>
                    <th class="p-3 text-center">Restock Cepat</th>
                </tr>
            </thead>
            <tbody id="stok-barang-tbody" class="divide-y divide-gray-100 text-gray-700"></tbody>
        </table>
    </div>
</div>

<!-- Modal Restock Cepat -->
<div id="modal-restock" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl space-y-4">
        <h3 class="font-bold text-gray-800 text-sm">Tambah Stok Produk</h3>
        <p id="restock-prod-name" class="text-xs text-gray-600 font-semibold">-</p>
        <form onsubmit="StokBarangPage.saveRestock(event)" class="space-y-3 text-xs">
            <input type="hidden" id="restock-prod-id">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Jumlah Stok Tambahan</label>
                <input type="number" id="restock-qty" required min="1" value="10" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-500 text-sm font-bold">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="StokBarangPage.closeModal()" class="px-3 py-1.5 border rounded-lg text-gray-600">Batal</button>
                <button type="submit" class="px-4 py-1.5 bg-sage-600 text-white font-bold rounded-lg hover:bg-sage-700">Tambah</button>
            </div>
        </form>
    </div>
</div>
