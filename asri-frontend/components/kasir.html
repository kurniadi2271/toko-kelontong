<div id="view-kasir" class="grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Katalog Produk -->
    <div class="lg:col-span-7 xl:col-span-8 space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-3 items-center justify-between">
            <div class="relative w-full md:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="kasir-search" oninput="KasirPage.render()" placeholder="Cari nama barang / barcode..." class="w-full pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sage-500">
            </div>
            <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 text-xs" id="kasir-category-filters"></div>
        </div>

        <div id="kasir-product-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4 max-h-[calc(100vh-230px)] overflow-y-auto pr-1">
            <div class="col-span-full py-12 text-center text-gray-400 text-xs">Memuat produk...</div>
        </div>
    </div>

    <!-- Keranjang Belanja -->
    <div class="lg:col-span-5 xl:col-span-4">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[calc(100vh-140px)] sticky top-20">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-xl">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-sage-600"></i>
                    <h2 class="font-bold text-gray-800 text-sm">Keranjang Belanja</h2>
                    <span id="cart-item-count" class="bg-sage-100 text-sage-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </div>
                <button onclick="KasirPage.clearCart()" class="text-xs text-red-500 hover:text-red-700 font-medium transition flex items-center gap-1">
                    <i class="fa-regular fa-trash-can"></i> Kosongkan
                </button>
            </div>

            <div id="cart-items-list" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-gray-100"></div>

            <div class="p-4 border-t border-gray-100 bg-gray-50/80 rounded-b-xl space-y-3">
                <div class="space-y-1.5 text-xs text-gray-600">
                    <div class="flex justify-between">
                        <span>Subtotal</span>
                        <span id="cart-subtotal" class="font-semibold text-gray-800">Rp 0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span>Diskon Transaksi</span>
                        <div class="flex items-center gap-1">
                            <input type="number" id="cart-discount" oninput="KasirPage.updateCartTotals()" value="0" min="0" max="100" class="w-12 text-right px-1.5 py-0.5 border rounded text-xs focus:ring-1 focus:ring-sage-500">
                            <span>%</span>
                        </div>
                    </div>
                    <div class="flex justify-between text-sm font-bold text-sage-800 pt-2 border-t border-gray-200">
                        <span>TOTAL AKHIR</span>
                        <span id="cart-grand-total" class="text-base text-sage-600">Rp 0</span>
                    </div>
                </div>

                <button onclick="KasirPage.openCheckoutModal()" id="btn-checkout" disabled class="w-full py-3 bg-sage-600 text-white font-bold rounded-xl shadow-md hover:bg-sage-700 disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-credit-card"></i> Bayar Sekarang
                </button>
            </div>
        </div>
    </div>
</div>
