<div class="space-y-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl border border-gray-100 shadow-sm space-y-6">
        <div class="border-b pb-3">
            <h3 class="font-bold text-gray-800 text-base">Pengaturan Identitas Toko &amp; Keamanan Admin</h3>
            <p class="text-xs text-gray-500">Ubah nama toko, alamat, serta password akun admin</p>
        </div>

        <form onsubmit="SettingsPage.save(event)" class="space-y-4 text-xs">
            <div class="space-y-3 p-4 bg-gray-50 rounded-xl border border-gray-100">
                <h4 class="font-bold text-sage-700 text-xs flex items-center gap-2"><i class="fa-solid fa-store"></i> Identitas Toko</h4>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Nama Toko</label>
                    <input type="text" id="setting-store-name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-500">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Alamat Toko (Tampil di Struk)</label>
                    <input type="text" id="setting-store-address" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-500">
                </div>
            </div>

            <div class="space-y-3 p-4 bg-gray-50 rounded-xl border border-gray-100">
                <h4 class="font-bold text-sage-700 text-xs flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> Keamanan Akun Admin</h4>
                <div class="pt-2 border-t border-gray-200">
                    <label class="block font-semibold text-gray-700 mb-1">Password Admin Saat Ini</label>
                    <input type="password" id="setting-current-pass" required placeholder="Wajib diisi untuk konfirmasi perubahan" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-500">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Password Baru (Opsional)</label>
                    <input type="password" id="setting-new-pass" placeholder="Biarkan kosong jika tidak diubah" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-500">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Konfirmasi Password Baru</label>
                    <input type="password" id="setting-confirm-pass" placeholder="Ulangi password baru" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-500">
                </div>
            </div>

            <div class="pt-2 flex justify-between items-center">
                <button type="button" onclick="AuthPage.logout()" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg font-bold hover:bg-red-200">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar Modus Admin
                </button>
                <button type="submit" class="px-5 py-2 bg-sage-600 text-white font-bold rounded-lg hover:bg-sage-700 shadow">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
