<header class="bg-sage-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-wood-500 p-2 rounded-lg text-white">
                <i class="fa-solid fa-store text-xl"></i>
            </div>
            <div>
                <h1 id="app-header-store-name" class="font-bold text-lg leading-tight">Supermarket XYZ</h1>
                <p class="text-xs text-sage-200">Sistem Kasir &amp; Manajemen Toko Modern</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div class="bg-sage-800 p-1 rounded-xl flex items-center border border-sage-600">
                <button id="nav-btn-kasir" onclick="handleKasirNavClick()" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center gap-2 text-sage-200 hover:text-white">
                    <i class="fa-solid fa-cash-register"></i> Kasir (POS)
                    <span id="kasir-lock-icon" class="text-xs"><i class="fa-solid fa-lock text-yellow-400"></i></span>
                </button>
                <button id="nav-btn-admin" onclick="handleAdminNavClick()" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 flex items-center gap-2 text-sage-200 hover:text-white">
                    <i class="fa-solid fa-user-shield"></i> Admin Panel
                    <span id="admin-lock-icon" class="text-xs"><i class="fa-solid fa-lock text-yellow-400"></i></span>
                </button>
            </div>

            <div class="hidden sm:flex items-center gap-2 text-xs text-sage-100 bg-sage-800 px-3 py-1.5 rounded-lg">
                <i class="fa-regular fa-clock"></i>
                <span id="realtime-clock">00:00:00</span>
            </div>
        </div>
    </div>
</header>
