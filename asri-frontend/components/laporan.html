<div class="space-y-4">
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto text-xs">
            <label class="font-medium text-gray-600">Dari:</label>
            <input type="date" id="report-date-start" onchange="LaporanPage.render()" class="px-2.5 py-1.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-sage-500">
            <label class="font-medium text-gray-600">Sampai:</label>
            <input type="date" id="report-date-end" onchange="LaporanPage.render()" class="px-2.5 py-1.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-sage-500">
        </div>
        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
            <button onclick="LaporanPage.downloadReport('xlsx')" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-excel"></i> Unduh Excel (.xlsx)
            </button>
            <button onclick="LaporanPage.downloadReport('pdf')" class="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg text-xs transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-pdf"></i> Unduh PDF
            </button>
        </div>
    </div>

    <div class="bg-sage-800 text-white p-5 rounded-xl shadow-md grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="border-r border-sage-700 pr-4">
            <p class="text-xs text-sage-200">Total Revenue / Omset</p>
            <h2 id="report-summary-omset" class="text-xl font-bold mt-1">Rp 0</h2>
        </div>
        <div class="border-r border-sage-700 pr-4">
            <p class="text-xs text-sage-200">Total HPP / Modal Barang</p>
            <h2 id="report-summary-hpp" class="text-xl font-bold mt-1 text-red-300">Rp 0</h2>
        </div>
        <div>
            <p class="text-xs text-sage-200">Laba Bersih (Net Profit)</p>
            <h2 id="report-summary-laba" class="text-2xl font-bold mt-1 text-green-300">Rp 0</h2>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-x-auto">
        <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 border-b border-gray-100 text-gray-600 font-semibold uppercase">
                <tr>
                    <th class="p-3">ID Transaksi</th>
                    <th class="p-3">Tanggal &amp; Waktu</th>
                    <th class="p-3">Metode Bayar</th>
                    <th class="p-3 text-right">Total Belanja</th>
                    <th class="p-3 text-right">Total HPP</th>
                    <th class="p-3 text-right">Laba Bersih</th>
                    <th class="p-3 text-center">Aksi</th>
                </tr>
            </thead>
            <tbody id="laporan-tbody" class="divide-y divide-gray-100 text-gray-700"></tbody>
        </table>
    </div>
</div>
